function renderStyleControls(){

 let group='';for(const d of styleDefs){if(['distance','blur'].includes(d.id))continue;const root=d.advanced||d.id==='focal'?advanced:basic;
 if(d.group!==group || root.dataset.lastGroup!==d.group){const h=document.createElement('h3');h.className='style-section-title';h.textContent=d.group;root.append(h);root.dataset.lastGroup=d.group;group=d.group;}

 const head=document.createElement('div');head.className='style-head';const label=document.createElement('label');label.textContent=d.name;const mode=document.createElement('select');mode.setAttribute('aria-label',d.name+' 모드');for(const [v,t] of [['auto','AI 자동'],['manual','직접 설정']]){const o=document.createElement('option');o.value=v;o.textContent=t;mode.append(o)}mode.value=s.mode;mode.disabled=locked;mode.onchange=()=>{s.mode=mode.value;renderStyleControls()};head.append(label,mode);w.append(head);

function resolveStyle(){const parts=[],warnings=[];for(const d of styleDefs){if(['distance','blur'].includes(d.id))continue;const s=styleState[d.id];if(s.mode!=='manual'||styleLocked(d.id))continue;let i=d.type==='scale'?s.value-1:d.type==='palette'?stylePalette.findIndex(p=>p[0]===s.value):d.opts.findIndex(o=>o[0]===s.value);if(i>=0&&STYLE_EN[d.id]?.[i])parts.push(STYLE_EN[d.id][i]);}
 const focal=styleState.focal,perspMode=document.querySelector('[data-mode="perspective"]'),persp=document.getElementById('perspective');if(focal.mode==='manual'&&perspMode?.value==='direct'){if((focal.value==='wide'&&['compressed','strong_compressed'].includes(persp.value))||(focal.value==='tele'&&['strong','moderate'].includes(persp.value)))warnings.push('화각과 원근감의 조합을 확인하세요. 촬영 거리의 영향도 고려해야 합니다.');}
 return {parts,warnings};}
