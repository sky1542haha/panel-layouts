 if(d.group!==group || root.dataset.lastGroup!==d.group){const h=document.createElement('h3');h.className='style-section-title';h.textContent=d.group;root.append(h);root.dataset.lastGroup=d.group;group=d.group;}
 const s=styleState[d.id],locked=styleLocked(d.id);const w=document.createElement('div');w.className='style-control';
 const head=document.createElement('div');head.className='style-head';const label=document.createElement('label');label.textContent=d.name;const mode=document.createElement('select');mode.setAttribute('aria-label',d.name+' 모드');for(const [v,t] of [['auto','AI 자동'],['manual','직접 설정']]){const o=document.createElement('option');o.value=v;o.textContent=t;mode.append(o)}mode.value=s.mode;mode.disabled=locked;mode.onchange=()=>{s.mode=mode.value;renderStyleControls()};head.append(label,mode);w.append(head);
 if(locked){const n=document.createElement('div');n.className='style-warning';n.textContent='흑백 선택 중에는 적용하지 않습니다. 이전 값은 보존됩니다.';w.append(n)}
 else if(s.mode==='manual'){
 if(d.type==='select'){const select=document.createElement('select');select.className='style-value';for(const [v,t] of d.opts){const o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)}select.value=s.value;select.onchange=()=>{s.value=select.value;renderStyleControls()};w.append(select);const desc=document.createElement('p');desc.className='style-desc';desc.textContent=d.opts.find(o=>o[0]===s.value)[2];w.append(desc)}
 else if(d.type==='palette'){const grid=document.createElement('div');grid.className='style-swatches';for(const [v,t,desc,colors] of stylePalette){const b=document.createElement('button');b.type='button';b.className='style-palette'+(s.value===v?' chosen':'');const bar=document.createElement('div');bar.className='style-colors';for(const color of colors){const i=document.createElement('i');i.style.backgroundColor=color;bar.append(i)}const title=document.createElement('span');title.textContent=t+' · '+desc;b.append(bar,title);b.onclick=()=>{s.value=v;renderStyleControls()};grid.append(b)}w.append(grid)}
 else {const text=document.createElement('div');text.className='style-selected';text.textContent=s.value+' / 5 · '+d.labels[s.value-1];const input=document.createElement('input');input.type='range';input.min=1;input.max=5;input.step=1;input.value=s.value;const hint=document.createElement('p');hint.className='style-desc';const sync=()=>{s.value=+input.value;text.textContent=s.value+' / 5 · '+d.labels[s.value-1];hint.textContent='출력: '+STYLE_EN[d.id][s.value-1]};input.oninput=sync;sync();w.append(text,input,hint)}
 }root.append(w)
 }
 // Unified depth of field: one five-step control, adapted to original focus engine.
 const blur=styleDefs.find(d=>d.id==='blur');const s=styleState.blur;const host=document.querySelector('#focus').closest('.field').parentElement;
 let container=document.getElementById('integratedBlur');if(!container){container=document.createElement('div');container.id='integratedBlur';container.className='field';host.append(container)}container.innerHTML='<label>배경 흐림 · 심도</label><select id="blurMode"><option value="auto">AI 자동</option><option value="manual">직접 설정</option></select><div id="blurManual"></div>';
 const m=container.querySelector('#blurMode');m.value=s.mode;m.onchange=()=>{s.mode=m.value;renderStyleControls()};const slot=container.querySelector('#blurManual');if(s.mode==='manual'){const t=document.createElement('div');t.className='style-selected';const inp=document.createElement('input');inp.type='range';inp.min=1;inp.max=5;inp.value=s.value;inp.step=1;inp.style.width='100%';const hint=document.createElement('small');const sync=()=>{s.value=+inp.value;t.textContent=s.value+' / 5 · '+blur.labels[s.value-1];hint.textContent=blur.words[s.value-1]};inp.oninput=sync;sync();slot.append(t,inp,hint)}
}
function resolveStyle(){const parts=[],warnings=[];for(const d of styleDefs){if(['distance','blur'].includes(d.id))continue;const s=styleState[d.id];if(s.mode!=='manual'||styleLocked(d.id))continue;let i=d.type==='scale'?s.value-1:d.type==='palette'?stylePalette.findIndex(p=>p[0]===s.value):d.opts.findIndex(o=>o[0]===s.value);if(i>=0&&STYLE_EN[d.id]?.[i])parts.push(STYLE_EN[d.id][i]);}
 const focal=styleState.focal,perspMode=document.querySelector('[data-mode="perspective"]'),persp=document.getElementById('perspective');if(focal.mode==='manual'&&perspMode?.value==='direct'){if((focal.value==='wide'&&['compressed','strong_compressed'].includes(persp.value))||(focal.value==='tele'&&['strong','moderate'].includes(persp.value)))warnings.push('화각과 원근감의 조합을 확인하세요. 촬영 거리의 영향도 고려해야 합니다.');}
 return {parts,warnings};}
function applyBlurAdapter(){const legacy=document.getElementById('blurAdjust'),mode=document.querySelector('[data-mode="blurAdjust"]');const s=styleState.blur;if(s.mode==='auto'){mode.value='ai';legacy.value='0'}else{mode.value='direct';legacy.value=[-40,-20,0,20,40][s.value-1]} }

const WORKSPACE_STORAGE_KEY='editorialPromptStudio:workspace';
const WORKSPACE_SCHEMA_VERSION=1;
let workspaceSaveTimer=null;
let workspaceRestoring=false;
function readWorkspaceState(){
 try{
  const raw=localStorage.getItem(WORKSPACE_STORAGE_KEY);
  if(!raw)return null;
  const state=JSON.parse(raw);
  if(!state||state.schemaVersion!==WORKSPACE_SCHEMA_VERSION)return null;
  return state;
 }catch(err){console.warn('작업 상태 불러오기 실패',err);return null}
}
function workspaceControlSnapshot(){
 const controls={};
 document.querySelectorAll('#controls input,#controls select,#controls textarea,.advanced-panel input,.advanced-panel select,.advanced-panel textarea').forEach(el=>{
  if(!el.id||el.id==='prompt'||el.disabled&&el.type==='hidden')return;
  if(el.type==='checkbox'||el.type==='radio')controls[el.id]=el.checked;
  else controls[el.id]=el.value;
 });
 const modes={};
 document.querySelectorAll('select[data-mode]').forEach(el=>{modes[el.dataset.mode]=el.value});
 return {controls,modes};
}
function writeWorkspaceState(){
 if(workspaceRestoring)return;
 try{
  const snap=workspaceControlSnapshot();
  const state={schemaVersion:WORKSPACE_SCHEMA_VERSION,savedAt:new Date().toISOString(),controls:snap.controls,modes:snap.modes,styleState:JSON.parse(JSON.stringify(styleState))};
  localStorage.setItem(WORKSPACE_STORAGE_KEY,JSON.stringify(state));
  const el=document.getElementById('saveStatus');if(el){const d=new Date();el.textContent='자동 저장됨 · '+d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' · 이 기기의 브라우저에만 저장';}
 }catch(err){const el=document.getElementById('saveStatus');if(el){el.textContent='자동 저장 실패 · Safari 사이트 저장공간을 확인하세요.';el.className='status warn'}console.warn('작업 상태 저장 실패',err)}
}
function scheduleWorkspaceSave(){
 if(workspaceRestoring)return;
 clearTimeout(workspaceSaveTimer);
 workspaceSaveTimer=setTimeout(writeWorkspaceState,350);
}
function setStoredControlValue(el,value){
 if(!el||value===undefined||value===null)return;
 if(el.type==='checkbox'||el.type==='radio')el.checked=!!value;
 else if([...el.options||[]].length && ![...el.options].some(o=>o.value===String(value)))return;
 else el.value=String(value);
}
function restoreWorkspaceState(state){
 if(!state)return false;
 workspaceRestoring=true;
 try{
  if(state.styleState&&typeof state.styleState==='object'){
   for(const [id,saved] of Object.entries(state.styleState)){
    if(styleState[id]&&saved&&typeof saved==='object'){
     if(saved.mode==='auto'||saved.mode==='manual')styleState[id].mode=saved.mode;
     if(saved.value!==undefined)styleState[id].value=saved.value;
    }
   }
  }
  const v=state.controls||{};
  setStoredControlValue(document.getElementById('poseMode'),v.poseMode);
  setStoredControlValue(document.getElementById('seatType'),v.seatType);
  updatePoseSlots();
  for(const [id,value] of Object.entries(v))setStoredControlValue(document.getElementById(id),value);
  for(const [id,value] of Object.entries(state.modes||{})){
   const mode=document.querySelector('select[data-mode="'+CSS.escape(id)+'"]');
   if(mode)setStoredControlValue(mode,value);
  }
  document.querySelectorAll('.rangeRow input[type="range"]').forEach(el=>el.dispatchEvent(new Event('input',{bubbles:false})));
  document.querySelectorAll('select[data-mode]').forEach(el=>el.dispatchEvent(new Event('change',{bubbles:false})));
  const rep=document.getElementById('representation');if(rep)rep.dispatchEvent(new Event('change',{bubbles:false}));
  updateHandCompatibilityUI();
  return true;
 }catch(err){console.warn('작업 상태 복원 실패',err);return false}
 finally{workspaceRestoring=false}
}
const savedWorkspace=readWorkspaceState();

render();
setupIntegratedPanels();
if(savedWorkspace?.styleState){
 for(const [id,saved] of Object.entries(savedWorkspace.styleState)){
  if(styleState[id]&&saved&&typeof saved==='object'){
   if(saved.mode==='auto'||saved.mode==='manual')styleState[id].mode=saved.mode;
   if(saved.value!==undefined)styleState[id].value=saved.value;
  }
 }
}
renderStyleControls();
const restoredWorkspace=restoreWorkspaceState(savedWorkspace);
document.addEventListener('change',e=>{if(e.target.closest('#controls,.advanced-panel'))scheduleWorkspaceSave()});
document.addEventListener('input',e=>{if(e.target.closest('#controls,.advanced-panel'))scheduleWorkspaceSave()});
document.addEventListener('click',e=>{if(e.target.closest('.style-palette'))scheduleWorkspaceSave()});
setTimeout(()=>{const el=document.getElementById('saveStatus');if(el&&restoredWorkspace)el.textContent='저장된 작업 설정을 복원했습니다. 이후 변경사항은 자동 저장됩니다.';},0);
const promptEl=document.querySelector('#prompt'),resolvedEl=document.querySelector('#resolved'),statusEl=document.querySelector('#status'),randomResultEl=document.querySelector('#randomResult');
document.querySelector('#generate').onclick=()=>{try{applyBlurAdapter();const s=resolve();const photo=resolveStyle();promptEl.value=compile(s,photo.parts);resolvedEl.textContent=summarize(s)+(photo.warnings.length?"\n\n사진 스타일 주의:\n- "+photo.warnings.join("\n- "):"");const rr=randomSummary(s).filter(x=>!s.pov||!['남성 자세:','남성 방향:','여성 기준 상대 위치:','두 사람의 거리:','카메라 거리 조정:'].some(k=>x.startsWith(k)));if(rr.length){randomResultEl.innerHTML='<b>이번 Random 결과</b>'+rr.map(x=>'• '+x).join('<br>');randomResultEl.classList.add('show')}else{randomResultEl.textContent='';randomResultEl.classList.remove('show')}statusEl.textContent=photo.warnings.length?'생성 완료 · 사진 스타일 주의 사항을 진단 정보에서 확인하세요.':s.status==='WARNING'?'생성 완료 · 서로 충돌하는 명시적 선택이 있습니다. 진단 정보를 확인하세요.':s.status==='RESOLVED'?'생성 완료 · 선택을 최대한 유지하면서 필요한 물리 보정을 적용했습니다.':s.status==='CHECK'?'생성 완료 · 선택값은 유지했습니다. 생성 난도가 높은 조합은 진단 정보를 확인하세요.':'생성 완료 · 선택한 설정이 그대로 성립합니다.';statusEl.className='status'+(s.status==='WARNING'?' warn':'');}catch(err){statusEl.textContent='프롬프트 생성 오류: '+err.message;statusEl.className='status warn';console.error(err);}};
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(promptEl.value);statusEl.textContent='현재 편집된 프롬프트를 복사했습니다.';}catch(err){promptEl.select();document.execCommand('copy');statusEl.textContent='현재 편집된 프롬프트를 복사했습니다.';}};
document.querySelector('#reset').onclick=()=>{if(!confirm('이 기기에 저장된 작업 설정을 지우고 기본값으로 돌아갈까요?'))return;try{localStorage.removeItem(WORKSPACE_STORAGE_KEY)}catch(err){console.warn(err)}location.reload();};
</script></body></html>
